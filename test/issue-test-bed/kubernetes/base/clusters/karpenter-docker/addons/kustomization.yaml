# What runs INSIDE the karpenter-docker workload cluster: Calico so nodes go
# Ready, Karpenter itself (from the provider's chart, which carries the CRDs),
# and the NodeClass and NodePool it provisions with. Applied with the workload
# kubeconfig:
#
#   kustomize build --enable-helm . | kubectl --kubeconfig ../../../../../kubeconfig/karpenter-docker.kubeconfig apply --server-side --field-manager=test-bed -f -
#
# The NodeClass and NodePool need the chart's CRDs established, so a first
# apply fails on them; re-applying converges. `make workload` loops until it
# does, after creating the Secret and image the Karpenter pod needs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - calico
  - karpenter
  - nodeclass.yaml
  - nodepool.yaml
