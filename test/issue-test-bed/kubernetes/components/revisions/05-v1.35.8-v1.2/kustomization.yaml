# Step 5 of the upgrade path: Class v1.1 -> v1.2: every template rotates. Control plane and workers roll together; same image.
# A component, so it is never built on its own: the dev overlay for the
# management cluster (../../../overlays/dev/clusters/management) lists the one
# it is at; `make deploy REVISION=05-v1.35.8-v1.2` points it here with yq and
# applies it. Deployed after the step before it; `make upgrade` only allows the next step.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      apiVersion: cluster.x-k8s.io/v1beta1
      kind: Cluster
      metadata:
        name: karpenter-docker
        namespace: karpenter-docker
        labels:
          test-bed/revision: 05-v1.35.8-v1.2
        annotations:
          test-bed/revision-description: "Class v1.1 -> v1.2: every template rotates. Control plane and workers roll together; same image."
      spec:
        topology:
          class: docker-kubeadm-v1.2
          version: v1.35.8
