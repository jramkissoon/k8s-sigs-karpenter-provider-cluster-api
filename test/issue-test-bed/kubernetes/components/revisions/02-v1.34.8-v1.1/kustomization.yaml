# Step 2 of the upgrade path: Class v1.0 -> v1.1: every template rotates. Control plane and workers roll together; same image.
# A component, so it is never built on its own: the dev overlay for the
# management cluster (../../../overlays/dev/clusters/management) lists the one
# it is at; `make deploy REVISION=02-v1.34.8-v1.1` points it here with yq and
# applies it. Deployed after the step before it; `make upgrade` only allows the next step.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      apiVersion: cluster.x-k8s.io/v1beta1
      kind: Cluster
      metadata:
        name: karpenter-docker
        namespace: karpenter-docker
        labels:
          test-bed/revision: 02-v1.34.8-v1.1
        annotations:
          test-bed/revision-description: "Class v1.0 -> v1.1: every template rotates. Control plane and workers roll together; same image."
      spec:
        topology:
          class: docker-kubeadm-v1.1
          version: v1.34.8
