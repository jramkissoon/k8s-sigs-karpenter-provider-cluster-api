# Added to every docker-kubeadm ClusterClass version.
#
# Node image: chosen by Kubernetes version from nodeImages, so it always
# matches the version each object is at, including while the topology
# controller holds workers back during a control plane upgrade. The digests
# are from the kind release notes; add an entry before using a new version.
#
# Worker metadata: the Karpenter scale-from-zero annotations describe a CAPD
# worker. They land on the MachineDeployment (and its Machines, harmlessly).
- op: add
  path: /spec/variables
  value:
    - name: nodeImages
      required: true
      schema:
        openAPIV3Schema:
          type: object
          description: kindest/node image, digest-pinned, per Kubernetes version.
          additionalProperties:
            type: string
          default:
            v1.34.8: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
            v1.34.11: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
            v1.35.8: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
- op: add
  path: /spec/patches
  value:
    - name: nodeImage
      description: Sets each DockerMachineTemplate's image from nodeImages by version.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: '{{ index .nodeImages .builtin.controlPlane.version }}'
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: DockerMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [karpenter-workers]
          jsonPatches:
            - op: add
              path: /spec/template/spec/customImage
              valueFrom:
                template: '{{ index .nodeImages .builtin.machineDeployment.version }}'
- op: add
  path: /spec/workers/machineDeployments/0/template/metadata
  value:
    annotations:
      capacity.cluster-autoscaler.kubernetes.io/cpu: "2"
      capacity.cluster-autoscaler.kubernetes.io/memory: "4G"
      capacity.cluster-autoscaler.kubernetes.io/maxPods: "110"
      capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=arm64,karpenter.sh/capacity-type=on-demand,node.kubernetes.io/instance-type=capd-worker,topology.kubernetes.io/zone=local-a
      cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"
      cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "5"
