# docker-kubeadm v1.2: v1.1 with every machine template rotated again.
#   docker-machine-v1.2, kubeadm-control-plane-v1.2, kubeadm-workers-v1.2
#   differ from v1.1 only in their test-bed labels: a second pure template
#   rotation, so the path can roll twice. Reuses docker-cluster-v1.0.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - clusterclass.yaml
  - docker-machine.yaml
  - kubeadm-control-plane.yaml
  - kubeadm-workers.yaml
